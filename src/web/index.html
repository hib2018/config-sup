<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>config-sup</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main><h1>config-sup</h1><p>公開GitHubリポジトリから設定項目を探し、選択したローカルJSONファイルに適用します。</p>
<form id="analyze"><label for="url">GitHub URL</label><div class="row"><input id="url" type="url" required placeholder="https://github.com/owner/repo"><button>解析</button></div><label class="check"><input id="agent" type="checkbox"> エージェントで説明を補う（設定値を外部APIに送信）</label></form>
<p id="status" role="status"></p><section id="editor" hidden><label for="source">解析元の設定ファイル</label><select id="source"></select><p id="agent-status"></p><button id="pick" type="button">適用先のローカルJSONファイルを選択</button><p id="destination"></p><div id="fields"></div><button id="preview" type="button" disabled>差分を確認</button><section id="review" hidden><h2>適用前の差分</h2><pre id="diff"></pre><button id="apply" type="button">このファイルに適用</button></section></section>
</main></body></html>
